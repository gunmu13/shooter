<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>双人射击</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden;touch-action:none;font-family:sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay h2{margin-bottom:20px}
.overlay input,.overlay button{width:100%;max-width:300px;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:1rem;text-align:center}
.overlay input{background:#1a1a3a;color:#fff}
.overlay button{background:#e94560;color:#fff;font-weight:bold}
.hidden{display:none!important}
#joystick{position:fixed;bottom:40px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);z-index:5}
#knob{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);top:35px;left:35px;pointer-events:none}
#shootBtn{position:fixed;bottom:60px;right:40px;width:80px;height:80px;border-radius:50%;background:#e94560;color:#fff;font-size:1rem;font-weight:bold;border:none;z-index:5}
#hud{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:1rem;font-weight:bold;pointer-events:none;z-index:5}
#status{position:fixed;top:40px;left:0;right:0;text-align:center;font-size:.85rem;color:#aaa;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"></div>
<div id="status" class="hidden"></div>
<div id="joystick" class="hidden"><div id="knob"></div></div>
<button id="shootBtn" class="hidden">射击</button>

<div id="home" class="overlay">
  <h2>🔫 双人射击</h2>
  <button onclick="createRoom()">创建房间（当主机）</button>
  <div style="color:#666;margin:8px 0">—— 或 ——</div>
  <input id="roomCode" placeholder="输入房间号" maxlength="6" style="text-transform:uppercase">
  <button onclick="joinRoom()">加入房间</button>
</div>

<div id="wait" class="overlay hidden">
  <h2>等待对手加入...</h2>
  <p id="myCode" style="margin:20px 0;font-size:2rem;color:#e94560;font-weight:bold"></p>
  <p style="color:#888">把上面的房间号发给好友</p>
</div>

<div id="over" class="overlay hidden">
  <h2 id="overText"></h2>
  <button onclick="location.reload()" style="margin-top:20px">再来一局</button>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}resize();onresize=resize;

let me={x:200,y:300,hp:100,kills:0,alive:true,angle:0};
let opp={x:600,y:300,hp:100,kills:0,alive:true,angle:0};
let bullets=[],gameActive=false,conn=null,peer=null,shootCooldown=0,respawnTimer=null;
const keys={up:0,down:0,left:0,right:0,shoot:0};

// 摇杆
const joystick=document.getElementById('joystick'),knob=document.getElementById('knob');
let joyActive=false;
joystick.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true});
joystick.addEventListener('touchmove',e=>{
  e.preventDefault();if(!joyActive)return;
  const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,t=e.touches[0];
  let dx=t.clientX-cx,dy=t.clientY-cy;
  const d=Math.min(40,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
  knob.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;
  keys.right=dx>10;keys.left=dx<-10;keys.down=dy>10;keys.up=dy<-10;
});
joystick.addEventListener('touchend',e=>{e.preventDefault();joyActive=false;knob.style.transform='';keys.up=keys.down=keys.left=keys.right=0});

// 射击按钮
document.getElementById('shootBtn').addEventListener('touchstart',e=>{e.preventDefault();keys.shoot=1});
document.getElementById('shootBtn').addEventListener('touchend',e=>{e.preventDefault();keys.shoot=0});

// 键盘
onkeydown=e=>{const k=e.key.toLowerCase();if(k=='w')keys.up=1;if(k=='s')keys.down=1;if(k=='a')keys.left=1;if(k=='d')keys.right=1;if(k==' ')keys.shoot=1};
onkeyup=e=>{const k=e.key.toLowerCase();if(k=='w')keys.up=0;if(k=='s')keys.down=0;if(k=='a')keys.left=0;if(k=='d')keys.right=0;if(k==' ')keys.shoot=0};

function send(d){if(conn&&conn.open)conn.send(d)}

function handleMessage(d){
  if(d.type=='state'){opp.x=d.x;opp.y=d.y;opp.hp=d.hp;opp.kills=d.kills;opp.alive=d.alive}
  else if(d.type=='shoot'){bullets.push({x:d.x,y:d.y,vx:d.vx,vy:d.vy,owner:'opp',life:100})}
  else if(d.type=='hit'){
    me.hp-=25;
    if(me.hp<=0){me.hp=0;me.alive=false;send({type:'died'});
      if(respawnTimer)clearTimeout(respawnTimer);
      respawnTimer=setTimeout(()=>{me.hp=100;me.alive=true;me.x=100+Math.random()*Math.max(1,W-200);me.y=100+Math.random()*Math.max(1,H-200)},2000);
    }
  }
  else if(d.type=='died'){me.kills++}
}

function gameLoop(){
  if(!gameActive)return requestAnimationFrame(gameLoop);
  const speed=5;
  if(keys.up)me.y-=speed;if(keys.down)me.y+=speed;
  if(keys.left)me.x-=speed;if(keys.right)me.x+=speed;
  me.x=Math.max(20,Math.min(W-20,me.x));me.y=Math.max(20,Math.min(H-20,me.y));
  if(opp.alive)me.angle=Math.atan2(opp.y-me.y,opp.x-me.x);

  if(shootCooldown>0)shootCooldown--;
  if(keys.shoot&&shootCooldown==0&&me.alive){
    const b={x:me.x+Math.cos(me.angle)*25,y:me.y+Math.sin(me.angle)*25,vx:Math.cos(me.angle)*8,vy:Math.sin(me.angle)*8,owner:'me',life:100};
    bullets.push(b);send({type:'shoot',x:b.x,y:b.y,vx:b.vx,vy:b.vy});shootCooldown=12;
  }

  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.x<0||b.x>W||b.y<0||b.y>H||b.life<=0)return false;
    if(b.owner=='me'&&opp.alive){
      if(Math.hypot(b.x-opp.x,b.y-opp.y)<22){send({type:'hit'});return false}
    }
    return true;
  });

  send({type:'state',x:me.x,y:me.y,hp:me.hp,kills:me.kills,alive:me.alive});
  render();
  requestAnimationFrame(gameLoop);
}

function render(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#1a1a3a';ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  bullets.forEach(b=>{ctx.fillStyle=b.owner=='me'?'#ffcc00':'#ff5555';ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill()});
  drawPlayer(opp,'#e94560');drawPlayer(me,'#0ea5e9');

  document.getElementById('hud').textContent=`你:${me.kills}击杀 | 对手:${opp.kills}击杀`;

  if(me.kills>=5&&gameActive){gameActive=false;document.getElementById('overText').textContent='🏆 你赢了！';document.getElementById('over').classList.remove('hidden')}
  else if(opp.kills>=5&&gameActive){gameActive=false;document.getElementById('overText').textContent='😢 你输了';document.getElementById('over').classList.remove('hidden')}
}

function drawPlayer(p,c){
  if(!p.alive)return;
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,20,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(p.angle)*30,p.y+Math.sin(p.angle)*30);ctx.stroke();
  ctx.fillStyle='#333';ctx.fillRect(p.x-25,p.y-38,50,6);
  ctx.fillStyle=c;ctx.fillRect(p.x-25,p.y-38,50*(p.hp/100),6);
}

function createRoom(){
  const code=Math.random().toString(36).substring(2,7).toUpperCase();
  peer=new Peer('duelshooter-'+code,{debug:1});
  peer.on('open',()=>{
    document.getElementById('myCode').textContent=code;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('wait').classList.remove('hidden');
  });
  peer.on('connection',c=>{conn=c;setupConnection()});
  peer.on('error',()=>{alert('创建失败，请重试');location.reload()});
}

function joinRoom(){
  const code=document.getElementById('roomCode').value.trim().toUpperCase();
  if(!code)return alert('请输入房间号');
  peer=new Peer({debug:1});
  peer.on('open',()=>{
    conn=peer.connect('duelshooter-'+code);
    conn.on('open',setupConnection);
  });
  peer.on('error',()=>{alert('连接失败，请检查房间号');location.reload()});
}

function setupConnection(){
  conn.on('data',handleMessage);
  conn.on('close',()=>{alert('对方已离开');location.reload()});
  document.getElementById('home').classList.add('hidden');
  document.getElementById('wait').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('joystick').classList.remove('hidden');
  document.getElementById('shootBtn').classList.remove('hidden');
  gameActive=true;
  gameLoop();
}
</script>
</body>
</html>
