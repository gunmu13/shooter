<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>双人射击对战</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#0a0a1a;overflow:hidden;touch-action:none;font-family:sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay h2{margin-bottom:20px;text-align:center}
.overlay input,.overlay button{width:100%;max-width:320px;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:1rem;text-align:center}
.overlay input{background:#1a1a3a;color:#fff}
.overlay button{background:#e94560;color:#fff;font-weight:bold}
.hidden{display:none!important}
#hud{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:1rem;font-weight:bold;pointer-events:none;z-index:5}
#status{position:fixed;top:40px;left:0;right:0;text-align:center;font-size:.85rem;color:#aaa;pointer-events:none;z-index:5}
#reloadTip{position:fixed;bottom:180px;right:30px;background:#e94560;padding:8px 16px;border-radius:8px;font-weight:bold;display:none;z-index:5}
#joystick{position:fixed;bottom:40px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);z-index:5}
#knob{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5);top:35px;left:35px;pointer-events:none}
.btn{position:fixed;border-radius:50%;color:#fff;font-weight:bold;border:none;z-index:5;touch-action:none}
#shootBtn{bottom:60px;right:30px;width:80px;height:80px;background:#e94560;font-size:1rem}
#slideBtn{bottom:40px;right:130px;width:60px;height:60px;background:#0ea5e9;font-size:.8rem}
#aimBtn{bottom:40px;right:210px;width:60px;height:60px;background:#f59e0b;font-size:.8rem}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px}
.menu-btn{background:#1a1a3a;border:1px solid #333;padding:20px 10px;border-radius:10px;text-align:center;cursor:pointer}
.menu-btn.active{background:#e94560;border-color:#e94560}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden"></div>
<div id="status" class="hidden"></div>
<div id="reloadTip">换弹中...</div>
<div id="joystick" class="hidden"><div id="knob"></div></div>
<button id="shootBtn" class="btn hidden">射击</button>
<button id="slideBtn" class="btn hidden">滑铲</button>
<button id="aimBtn" class="btn hidden">瞄准</button>

<div id="home" class="overlay">
  <h2>🔫 双人射击对战</h2>
  <div style="margin-bottom:10px;color:#aaa">选择模式：</div>
  <div class="menu-grid">
    <div class="menu-btn active" data-mode="single">单人 vs AI</div>
    <div class="menu-btn" data-mode="rifle">步枪对战</div>
    <div class="menu-btn" data-mode="shotgun">散弹枪对战</div>
    <div class="menu-btn" data-mode="sniper">狙击枪对战</div>
  </div>
  <button onclick="startGame()" style="margin-top:20px">开始游戏</button>
  <div style="color:#666;margin:10px 0">—— 或者联机 ——</div>
  <button onclick="createRoom()" style="background:#0ea5e9">创建房间</button>
  <input id="roomCode" placeholder="输入房间号" maxlength="6" style="text-transform:uppercase">
  <button onclick="joinRoom()" style="background:#0ea5e9">加入房间</button>
</div>

<div id="wait" class="overlay hidden">
  <h2>等待对手加入...</h2>
  <p id="myCode" style="margin:20px 0;font-size:2rem;color:#e94560;font-weight:bold"></p>
  <p style="color:#888">把上面的房间号发给好友</p>
</div>

<div id="over" class="overlay hidden">
  <h2 id="overText"></h2>
  <button onclick="location.reload()" style="margin-top:20px">再来一局</button>
</div>

<script>
// ================== 基础配置 ==================
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); onresize = resize;

const WEAPONS = {
  rifle:   { name:'步枪',   mag: 30, reload: 1500, speed: 6,  fireRate: 12, damage: 20, spread: 0.05, bullets: 1, color:'#0ea5e9' },
  shotgun: { name:'散弹枪', mag: 2,  reload: 2500, speed: 5,  fireRate: 25, damage: 34, spread: 0.15, bullets: 3, color:'#e94560' },
  sniper:  { name:'狙击枪', mag: 5,  reload: 2800, speed: 4,  fireRate: 60, damage: 80, spread: 0.01, bullets: 1, color:'#f59e0b' }
};

let gameMode = 'single';
let gameActive = false;
let conn = null, peer = null, isHost = true;

let me = { x: 200, y: 300, hp: 100, kills: 0, alive: true, angle: 0, weapon: 'rifle', ammo: 30, isReloading: false, reloadTimer: 0, isSliding: false, slideTimer: 0 };
let opp = { x: 600, y: 300, hp: 100, kills: 0, alive: true, angle: 0, weapon: 'rifle', ammo: 30, isReloading: false, reloadTimer: 0, isSliding: false, slideTimer: 0 };
let bullets = [];
let obstacles = [];
let keys = { up: 0, down: 0, left: 0, right: 0, shoot: 0, slide: 0, aim: 0 };
let shootCooldown = 0;
let respawnTimer = null;
let aiTimer = 0;

function setWeapon(w) {
  me.weapon = w;
  me.ammo = WEAPONS[w].mag;
  me.isReloading = false;
  updateWeaponUI();
}

function updateWeaponUI() {
  document.getElementById('aimBtn').classList.toggle('hidden', me.weapon !== 'sniper');
}

function initMap() {
  obstacles = [];
  if (gameMode === 'shotgun') {
    for (let i = 0; i < 8; i++) {
      obstacles.push({ x: 100 + Math.random() * (W - 200), y: 100 + Math.random() * (H - 200), w: 80, h: 40 });
    }
  } else if (gameMode === 'rifle') {
    for (let i = 0; i < 5; i++) {
      obstacles.push({ x: 80 + Math.random() * (W - 160), y: 80 + Math.random() * (H - 160), w: 100, h: 30 });
    }
  }
}

function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

// ================== 游戏循环 ==================
function gameLoop() {
  if (!gameActive) return requestAnimationFrame(gameLoop);

  const speed = WEAPONS[me.weapon].speed;

  if (me.slideTimer > 0) { me.slideTimer--; }
  if (keys.slide && me.slideTimer <= 0) {
    me.isSliding = true; me.slideTimer = 30; keys.slide = 0;
  }

  const canMove = !(me.weapon === 'sniper' && keys.aim > 0);

  if (canMove) {
    let dx = 0, dy = 0;
    if (keys.up) dy -= 1; if (keys.down) dy += 1;
    if (keys.left) dx -= 1; if (keys.right) dx += 1;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      me.x += (dx / len) * speed * (me.isSliding ? 2.5 : 1);
      me.y += (dy / len) * speed * (me.isSliding ? 2.5 : 1);
    }
  }

  if (gameMode === 'sniper') {
    if (me.x < 20 || me.x > W - 20) { me.x = Math.max(20, Math.min(W - 20, me.x)); }
    if (me.y < 20 || me.y > H - 20) { me.y = Math.max(20, Math.min(H - 20, me.y)); }
  } else {
    me.x = Math.max(20, Math.min(W - 20, me.x));
    me.y = Math.max(20, Math.min(H - 20, me.y));
  }

  if (opp.alive) me.angle = Math.atan2(opp.y - me.y, opp.x - me.x);

  if (me.isReloading) {
    me.reloadTimer -= 16;
    if (me.reloadTimer <= 0) { me.isReloading = false; me.ammo = WEAPONS[me.weapon].mag; }
    document.getElementById('reloadTip').style.display = 'block';
  } else {
    document.getElementById('reloadTip').style.display = 'none';
  }

  if (shootCooldown > 0) shootCooldown--;
  if (keys.shoot && shootCooldown === 0 && me.alive && !me.isReloading && me.ammo > 0) {
    const w = WEAPONS[me.weapon];
    for (let i = 0; i < w.bullets; i++) {
      const angle = me.angle + (Math.random() - 0.5) * w.spread + (i - 1) * 0.15 * w.spread;
      bullets.push({ x: me.x + Math.cos(angle) * 25, y: me.y + Math.sin(angle) * 25, vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10, owner: 'me', damage: w.damage, life: 100, color: w.color });
    }
    me.ammo--;
    shootCooldown = w.fireRate;
    if (me.ammo <= 0) { me.isReloading = true; me.reloadTimer = w.reload; }
    if (conn) conn.send({ type: 'shoot', x: me.x, y: me.y, angle: me.angle, weapon: me.weapon });
  }

  bullets = bullets.filter(b => {
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.x < 0 || b.x > W || b.y < 0 || b.y > H || b.life <= 0) return false;
    for (const o of obstacles) {
      if (b.x > o.x && b.x < o.x + o.w && b.y > o.y && b.y < o.y + o.h) return false;
    }
    if (b.owner === 'me' && opp.alive) {
      if (dist(b.x, b.y, opp.x, opp.y) < 22) { 
        opp.hp -= b.damage; 
        if(opp.hp<=0){opp.hp=0;opp.alive=false;me.kills++;if(conn)conn.send({type:'died'})}
        return false; 
      }
    }
    return true;
  });

  if (me.kills >= 5 && gameActive) { gameActive = false; document.getElementById('overText').textContent = '🏆 你赢了！'; document.getElementById('over').classList.remove('hidden'); }

  if (gameMode === 'single' && opp.alive && me.alive) {
    aiTimer--;
    if (aiTimer <= 0) {
      const dx = me.x - opp.x, dy = me.y - opp.y;
      opp.angle = Math.atan2(dy, dx);
      if (dist(opp.x, opp.y, me.x, me.y) > 200) {
        opp.x += Math.cos(opp.angle) * speed * 0.8;
        opp.y += Math.sin(opp.angle) * speed * 0.8;
      } else {
        if (Math.random() < 0.3 && !opp.isReloading && opp.ammo > 0) {
          const w = WEAPONS[opp.weapon];
          bullets.push({ x: opp.x + Math.cos(opp.angle) * 25, y: opp.y + Math.sin(opp.angle) * 25, vx: Math.cos(opp.angle) * 10, vy: Math.sin(opp.angle) * 10, owner: 'opp', damage: w.damage, life: 100, color: w.color });
          opp.ammo--;
          if (opp.ammo <= 0) { opp.isReloading = true; opp.reloadTimer = w.reload; }
        }
      }
      opp.x = Math.max(20, Math.min(W - 20, opp.x));
      opp.y = Math.max(20, Math.min(H - 20, opp.y));
      aiTimer = 10;
    }
    if (opp.isReloading) {
      opp.reloadTimer -= 16;
      if (opp.reloadTimer <= 0) { opp.isReloading = false; opp.ammo = WEAPONS[opp.weapon].mag; }
    }
  }

  if (conn && conn.open) {
    conn.send({ type: 'state', x: me.x, y: me.y, hp: me.hp, kills: me.kills, alive: me.alive, angle: me.angle, weapon: me.weapon, ammo: me.ammo, isReloading: me.isReloading });
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ================== 渲染 ==================
function render() {
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#1a1a3a'; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  ctx.fillStyle = '#2a2a4a'; ctx.strokeStyle = '#4a4a6a'; ctx.lineWidth = 2;
  obstacles.forEach(o => { ctx.fillRect(o.x, o.y, o.w, o.h); ctx.strokeRect(o.x, o.y, o.w, o.h); });

  bullets.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); });

  // 狙击枪红线
  if (me.weapon === 'sniper' && keys.aim > 0 && me.alive) {
    ctx.strokeStyle = 'rgba(255,0,0,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(me.x, me.y);
    ctx.lineTo(me.x + Math.cos(me.angle) * 2000, me.y + Math.sin(me.angle) * 2000); 
    ctx.stroke();
  }

  drawPlayer(opp, '#e94560'); 
  drawPlayer(me, '#0ea5e9');

  document.getElementById('hud').textContent = `你:${me.kills}击杀 | 对手:${opp.kills}击杀 | 弹药:${me.ammo}/${WEAPONS[me.weapon].mag}`;
}

function drawPlayer(p, c) {
  if (!p.alive) return;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(p.x, p.y, 20, 0, 7); ctx.fill();
  
  // 画枪械模型
  drawWeapon(p.x, p.y, p.angle, p.weapon);

  ctx.fillStyle = '#333'; ctx.fillRect(p.x - 25, p.y - 38, 50, 6);
  ctx.fillStyle = c; ctx.fillRect(p.x - 25, p.y - 38, 50 * (p.hp / 100), 6);
  
  ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(WEAPONS[p.weapon].name, p.x, p.y - 45);
}

// === 这里是全新加入的枪械模型绘制代码 ===
function drawWeapon(x, y, angle, weapon) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  if (weapon === 'rifle') {
    // 步枪（AR风格）：黑色枪身，橄榄绿护木和枪托，带弹匣
    ctx.fillStyle = '#2a2a2a'; // 枪身主体
    ctx.fillRect(0, -4, 40, 8);
    ctx.fillStyle = '#3a3a3a'; // 枪管
    ctx.fillRect(40, -2, 25, 4);
    ctx.fillStyle = '#4a5a3a'; // 护木
    ctx.fillRect(15, -5, 20, 10);
    ctx.fillStyle = '#2a2a2a'; // 弹匣
    ctx.fillRect(10, 4, 8, 15);
    ctx.fillStyle = '#4a5a3a'; // 枪托
    ctx.fillRect(-25, -5, 25, 10);
    ctx.fillStyle = '#111'; // 瞄准镜导轨
    ctx.fillRect(5, -8, 15, 4);
  } 
  else if (weapon === 'shotgun') {
    // 散弹枪：粗枪管，木质护木和枪托
    ctx.fillStyle = '#2a2a2a'; // 枪管
    ctx.fillRect(0, -5, 35, 10);
    ctx.fillStyle = '#3a3a3a'; // 枪管口
    ctx.fillRect(35, -6, 15, 12);
    ctx.fillStyle = '#6b4c3a'; // 木质护木
    ctx.fillRect(10, -7, 15, 14);
    ctx.fillStyle = '#2a2a2a'; // 泵动部件
    ctx.fillRect(12, -8, 10, 16);
    ctx.fillStyle = '#6b4c3a'; // 木质枪托
    ctx.fillRect(-30, -6, 30, 12);
    ctx.fillStyle = '#111'; // 顶部导轨
    ctx.fillRect(0, -10, 20, 4);
  } 
  else if (weapon === 'sniper') {
    // 狙击枪：长枪管，大瞄准镜，两脚架
    ctx.fillStyle = '#1a1a1a'; // 枪身
    ctx.fillRect(0, -4, 45, 8);
    ctx.fillStyle = '#2a2a2a'; // 长枪管
    ctx.fillRect(45, -3, 40, 6);
    ctx.fillStyle = '#111'; // 瞄准镜
    ctx.fillRect(10, -14, 30, 8);
    ctx.fillStyle = '#333'; // 瞄准镜支架
    ctx.fillRect(15, -6, 5, 4);
    ctx.fillRect(30, -6, 5, 4);
    ctx.fillStyle = '#4a5a3a'; // 枪托
    ctx.fillRect(-30, -6, 30, 12);
    // 两脚架
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(25, 4); ctx.lineTo(20, 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(25, 4); ctx.lineTo(30, 20); ctx.stroke();
    ctx.fillStyle = '#111'; // 弹匣
    ctx.fillRect(15, 4, 8, 12);
  }

  ctx.restore();
}
// === 枪械模型绘制代码结束 ===

// ================== 控制事件 ==================
const joystick = document.getElementById('joystick'), knob = document.getElementById('knob');
let joyActive = false;
joystick.addEventListener('touchstart', e => { e.preventDefault(); joyActive = true; });
joystick.addEventListener('touchmove', e => {
  e.preventDefault(); if (!joyActive) return;
  const r = joystick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, t = e.touches[0];
  let dx = t.clientX - cx, dy = t.clientY - cy;
  const d = Math.min(40, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
  knob.style.transform = `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
  keys.right = dx > 10; keys.left = dx < -10; keys.down = dy > 10; keys.up = dy < -10;
});
joystick.addEventListener('touchend', e => { e.preventDefault(); joyActive = false; knob.style.transform = ''; keys.up = keys.down = keys.left = keys.right = 0; });

document.getElementById('shootBtn').addEventListener('touchstart', e => { e.preventDefault(); keys.shoot = 1; });
document.getElementById('shootBtn').addEventListener('touchend', e => { e.preventDefault(); keys.shoot = 0; });
document.getElementById('slideBtn').addEventListener('touchstart', e => { e.preventDefault(); keys.slide = 1; });
document.getElementById('slideBtn').addEventListener('touchend', e => { e.preventDefault(); keys.slide = 0; });
document.getElementById('aimBtn').addEventListener('touchstart', e => { e.preventDefault(); keys.aim = 1; });
document.getElementById('aimBtn').addEventListener('touchend', e => { e.preventDefault(); keys.aim = 0; });

onkeydown = e => { const k = e.key.toLowerCase(); if (k == 'w') keys.up = 1; if (k == 's') keys.down = 1; if (k == 'a') keys.left = 1; if (k == 'd') keys.right = 1; if (k == ' ') keys.shoot = 1; if (k == 'shift') keys.slide = 1; };
onkeyup = e => { const k = e.key.toLowerCase(); if (k == 'w') keys.up = 0; if (k == 's') keys.down = 0; if (k == 'a') keys.left = 0; if (k == 'd') keys.right = 0; if (k == ' ') keys.shoot = 0; if (k == 'shift') keys.slide = 0; };

// ================== 联机通信 ==================
function send(d) { if (conn && conn.open) conn.send(d); }
function handleMessage(d) {
  if (d.type == 'state') {
    opp.x = d.x; opp.y = d.y; opp.hp = d.hp; opp.kills = d.kills; opp.alive = d.alive; opp.angle = d.angle;
    opp.weapon = d.weapon; opp.ammo = d.ammo; opp.isReloading = d.isReloading;
  } else if (d.type == 'shoot') {
    const w = WEAPONS[d.weapon];
    for (let i = 0; i < w.bullets; i++) {
      const angle = d.angle + (Math.random() - 0.5) * w.spread + (i - 1) * 0.15 * w.spread;
      bullets.push({ x: d.x + Math.cos(angle) * 25, y: d.y + Math.sin(angle) * 25, vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10, owner: 'opp', damage: w.damage, life: 100, color: w.color });
    }
  } else if (d.type == 'hit') {
    me.hp -= 20;
    if (me.hp <= 0) { me.hp = 0; me.alive = false; if (respawnTimer) clearTimeout(respawnTimer); respawnTimer = setTimeout(() => { me.hp = 100; me.alive = true; me.x = 100 + Math.random() * (W - 200); me.y = 100 + Math.random() * (H - 200); }, 2000); }
  } else if (d.type == 'died') { me.kills++; }
}

function startGame() {
  gameActive = true;
  gameMode = document.querySelector('.menu-btn.active').dataset.mode;
  me.weapon = gameMode === 'shotgun' ? 'shotgun' : gameMode === 'sniper' ? 'sniper' : 'rifle';
  opp.weapon = me.weapon;
  me.ammo = WEAPONS[me.weapon].mag; opp.ammo = WEAPONS[me.weapon].mag;

  document.getElementById('home').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('joystick').classList.remove('hidden');
  document.getElementById('shootBtn').classList.remove('hidden');
  document.getElementById('slideBtn').classList.remove('hidden');
  updateWeaponUI();

  if (gameMode === 'single') { opp.weapon = 'rifle'; opp.ammo = WEAPONS.rifle.mag; }
  initMap();
  if (!conn) gameLoop();
}

function createRoom() {
  const code = Math.random().toString(36).substring(2, 7).toUpperCase();
  peer = new Peer('duelshooter-' + code, { debug: 1 });
  peer.on('open', () => {
    document.getElementById('myCode').textContent = code;
    document.getElementById('home').classList.add('hidden');
    document.getElementById('wait').classList.remove('hidden');
  });
  peer.on('connection', c => { conn = c; setupConnection(); });
  peer.on('error', () => { alert('创建失败，请重试'); location.reload(); });
}

function joinRoom() {
  const code = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!code) return alert('请输入房间号');
  peer = new Peer({ debug: 1 });
  peer.on('open', () => {
    conn = peer.connect('duelshooter-' + code);
    conn.on('open', setupConnection);
  });
  peer.on('error', () => { alert('连接失败，请检查房间号'); location.reload(); });
}

function setupConnection() {
  conn.on('data', handleMessage);
  conn.on('close', () => { alert('对方已离开'); location.reload(); });
  document.getElementById('home').classList.add('hidden');
  document.getElementById('wait').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('joystick').classList.remove('hidden');
  document.getElementById('shootBtn').classList.remove('hidden');
  document.getElementById('slideBtn').classList.remove('hidden');
  updateWeaponUI();
  if (isHost) initMap();
  gameActive = true;
  gameLoop();
}
</script>
</body>
</html>
